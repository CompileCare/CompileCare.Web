services:
  web:
    build: .
    environment:
      CSP_CONNECT_SRC: "https://api.example.com https://identity.example.com"
      CSP_FRAME_SRC: "https://identity.example.com"
    ports:
      - "8080:80"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/"]
      interval: 10s
      timeout: 3s
      retries: 5
