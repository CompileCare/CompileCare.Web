name: Web CI
on:
  pull_request:
  push:
    branches: ["**"]
permissions:
  contents: read
jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - name: Audit locked dependencies
        run: npm audit
      - run: npm test
      - run: npm run build
      - name: Install Chromium for browser tests
        run: npx playwright install --with-deps chromium
      - name: Run browser end-to-end tests
        run: npm run test:e2e
      - name: Validate the isolated real-OIDC browser suite is discoverable
        run: npx playwright test --config=playwright.real-oidc.config.ts --list
      - name: Docker build and smoke test
        run: |
          docker compose -f docker-compose.yml -f docker-compose.csp-test.yml build
          docker compose -f docker-compose.yml -f docker-compose.csp-test.yml up -d
          for i in $(seq 1 20); do
            if curl --fail http://localhost:8080/ >/dev/null; then break; fi
            sleep 2
          done
          if ! curl --fail http://localhost:8080/ >/dev/null; then
            docker compose -f docker-compose.yml -f docker-compose.csp-test.yml logs
            exit 1
          fi
          headers="$(curl --fail --silent --show-error --head http://localhost:8080/)"
          for expected in \
            "X-Content-Type-Options: nosniff" \
            "Referrer-Policy: strict-origin-when-cross-origin" \
            "X-Frame-Options: DENY" \
            "X-Permitted-Cross-Domain-Policies: none" \
            "Cross-Origin-Resource-Policy: same-origin" \
            "Permissions-Policy: camera=(), microphone=(), geolocation=()" \
            "Content-Security-Policy: default-src 'self';" \
            "style-src 'self';" \
            "connect-src 'self' https://api.example.com https://identity.example.com;" \
            "frame-src 'self' https://identity.example.com;"; do
            if ! grep -Fqi "$expected" <<<"$headers"; then
              echo "Missing or incorrect security response header: $expected"
              echo "$headers"
              docker compose -f docker-compose.yml -f docker-compose.csp-test.yml logs
              exit 1
            fi
          done
          echo "Verified all required static-workspace security response headers."
          if grep -Fqi "unsafe-inline" <<<"$headers"; then
            echo "The Web CSP must not allow unsafe-inline."
            echo "$headers"
            exit 1
          fi
          echo "Verified the Web CSP blocks inline styles and scripts."
          echo "Running the complete browser workflow suite against the production Nginx container with the enforced CSP."
          CSP_TEST_BASE_URL=http://127.0.0.1:8080 npx playwright test --config=playwright.docker.config.ts e2e
          invalid_csp_output="$(docker compose run --rm --no-deps -e CSP_CONNECT_SRC='*' web 2>&1)" && {
            echo "The Web container accepted a wildcard CSP origin unexpectedly."
            exit 1
          }
          if ! grep -Fq "CSP_CONNECT_SRC contains an invalid origin" <<<"$invalid_csp_output"; then
            echo "The Web container failed for an unexpected reason when given an invalid CSP origin."
            echo "$invalid_csp_output"
            exit 1
          fi
          echo "Verified invalid wildcard CSP origins are rejected at container startup."
          insecure_csp_output="$(docker compose run --rm --no-deps -e CSP_CONNECT_SRC='http://api.example.com' -e ALLOW_INSECURE_CSP_ORIGINS=false web 2>&1)" && {
            echo "The Web container accepted an HTTP CSP origin without the local-only opt-in."
            exit 1
          }
          if ! grep -Fq "HTTP CSP origins are allowed only when ALLOW_INSECURE_CSP_ORIGINS=true" <<<"$insecure_csp_output"; then
            echo "The Web container failed for an unexpected reason when given an HTTP CSP origin."
            echo "$insecure_csp_output"
            exit 1
          fi
          echo "Verified HTTP CSP origins are rejected without the explicit local-development opt-in."
          missing_csp_output="$(docker compose run --rm --no-deps -e CSP_FRAME_SRC='' web 2>&1)" && {
            echo "The Web container accepted a missing CSP_FRAME_SRC value."
            exit 1
          }
          if ! grep -Fq "CSP_FRAME_SRC must contain at least one explicit origin" <<<"$missing_csp_output"; then
            echo "The Web container failed for an unexpected reason when CSP_FRAME_SRC was missing."
            echo "$missing_csp_output"
            exit 1
          fi
          echo "Verified missing CSP origins are rejected at container startup."
      - if: always()
        run: docker compose -f docker-compose.yml -f docker-compose.csp-test.yml down --volumes --remove-orphans
