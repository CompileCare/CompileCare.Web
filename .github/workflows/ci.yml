name: Web CI
on:
  pull_request:
  push:
    branches: ["**"]
permissions:
  contents: read
jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - name: Verify npm generated a lockfile
        run: test -s package-lock.json
      - name: Upload npm lockfile for reviewed reproducible dependency resolution
        uses: actions/upload-artifact@v4
        with:
          name: compilecare-web-package-lock
          path: package-lock.json
          if-no-files-found: error
      - name: Report dependency advisories
        run: npm audit --json || true
      - run: npm test
      - run: npm run build
      - name: Install Chromium for browser tests
        run: npx playwright install --with-deps chromium
      - name: Run browser end-to-end tests
        run: npm run test:e2e
      - name: Docker build and smoke test
        run: |
          docker compose build
          docker compose up -d
          for i in $(seq 1 20); do
            if curl --fail http://localhost:8080/ >/dev/null; then break; fi
            sleep 2
          done
          if ! curl --fail http://localhost:8080/ >/dev/null; then
            docker compose logs
            exit 1
          fi
          headers="$(curl --fail --silent --show-error --head http://localhost:8080/)"
          for expected in \
            "X-Content-Type-Options: nosniff" \
            "Referrer-Policy: strict-origin-when-cross-origin" \
            "X-Frame-Options: DENY" \
            "X-Permitted-Cross-Domain-Policies: none" \
            "Cross-Origin-Resource-Policy: same-origin" \
            "Permissions-Policy: camera=(), microphone=(), geolocation=()"; do
            if ! grep -Fqi "$expected" <<<"$headers"; then
              echo "Missing or incorrect security response header: $expected"
              echo "$headers"
              docker compose logs
              exit 1
            fi
          done
          echo "Verified all required static-workspace security response headers."
      - if: always()
        run: docker compose down --volumes --remove-orphans
