name: Web CI
on:
  pull_request:
  push:
    branches: ["**"]
permissions:
  contents: read
jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - name: Report dependency advisories
        run: npm audit --json || true
      - run: npm test
      - run: npm run build
      - name: Docker build and smoke test
        run: |
          docker compose build
          docker compose up -d
          for i in $(seq 1 20); do
            if curl --fail http://localhost:8080/ >/dev/null; then exit 0; fi
            sleep 2
          done
          docker compose logs
          exit 1
      - if: always()
        run: docker compose down --volumes --remove-orphans
